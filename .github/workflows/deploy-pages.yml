name: Validate and Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Check HTML structure and local links
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          import sys

          root = Path('.')
          pages = list(root.rglob('*.html'))
          errors = []

          class Check(HTMLParser):
              def __init__(self, page):
                  super().__init__()
                  self.page = page
                  self.titles = 0
                  self.h1s = 0
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'title': self.titles += 1
                  if tag == 'h1': self.h1s += 1
                  if tag in ('a', 'link', 'script', 'img'):
                      value = attrs.get('href') or attrs.get('src')
                      if value: self.links.append(value)

          for page in pages:
              check = Check(page)
              check.feed(page.read_text(encoding='utf-8'))
              if check.titles != 1: errors.append(f'{page}: expected exactly one <title>, found {check.titles}')
              if check.h1s != 1: errors.append(f'{page}: expected exactly one <h1>, found {check.h1s}')
              for value in check.links:
                  parsed = urlparse(value)
                  if parsed.scheme or value.startswith('//') or value.startswith('#'):
                      continue
                  target = (page.parent / parsed.path).resolve()
                  if parsed.path and not target.exists():
                      errors.append(f'{page}: missing local asset or link: {value}')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'Validated {len(pages)} HTML file(s): structure and local links are OK.')
          PY

      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for page in Path('.').rglob('*.html'):
              source = page.read_text(encoding='utf-8')
              scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', source, flags=re.S | re.I)
              for index, script in enumerate(scripts):
                  target = Path('/tmp') / f'{page.stem}-{index}.js'
                  target.write_text(script, encoding='utf-8')
          PY
          for file in /tmp/*.js; do [ -e "$file" ] && node --check "$file"; done

      - name: Run Python tests when present
        run: |
          if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi
          if [ -f pyproject.toml ] || [ -d tests ]; then
            python3 -m pip install pytest
            python3 -m pytest
          else
            echo "No Python test suite found; skipping pytest."
          fi

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
